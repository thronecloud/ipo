# WisdomInvest production stack — the whole living engine on one Docker host.
#
#   db        Postgres 16 (the durable store)
#   api       FastAPI read-layer (+ runs alembic migrations on boot)   :8000
#   web       Next.js dashboards (Research Desk + Engine Room)         :3000
#   scheduler always-on ingestion/analysis daemon (UTC cron)
#   backup    daily pg_dump into ./backups (14-day retention)
#
# Bring up:            docker compose up -d --build
# Watch the engine:    docker compose logs -f scheduler
# Enable analysis:     run `claude setup-token`, put CLAUDE_CODE_OAUTH_TOKEN in .env
#
# See DEPLOY.md for the full runbook.

services:
  db:
    image: postgres:16
    container_name: ipo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ipo
      POSTGRES_DB: ipo
    ports:
      # Loopback only: the credentials are ipo:ipo, so this must never be
      # reachable from off-host. Containers reach it over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - ipo_pgdata:/var/lib/postgresql/data
      # First-boot auto-restore: newest ./backups/ipo_*.dump seeds an EMPTY
      # volume (official image runs initdb.d only then). Migration to a new
      # machine = clone repo + copy backups/ + docker compose up -d.
      - ./backups:/backups:ro
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: wisdominvest-engine
    container_name: ipo_api
    init: true
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ipo:ipo@db:5432/ipo
      ANALYSIS_BACKEND: ${ANALYSIS_BACKEND:-cli}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-claude-fable-5}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        # BUILD-TIME: next build bakes this into routes-manifest.json as the
        # /api rewrite destination (see web/Dockerfile / ISSUE-001).
        NEXT_PUBLIC_API_BASE: http://api:8000
    image: wisdominvest-web
    container_name: ipo_web
    restart: unless-stopped
    environment:
      # Runtime parity for RSC fetches. The browser always calls same-origin
      # /api (proxied server-side to the baked base), so this never leaks.
      NEXT_PUBLIC_API_BASE: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    image: wisdominvest-engine
    container_name: ipo_scheduler
    init: true
    restart: unless-stopped
    command: python -m engine.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://ipo:ipo@db:5432/ipo
      ANALYSIS_BACKEND: ${ANALYSIS_BACKEND:-cli}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-claude-fable-5}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SCHED_TZ: UTC
      SCHED_ANALYZE_BATCH: ${SCHED_ANALYZE_BATCH:-20}
      SCHED_ANALYZE_DAILY_CAP: ${SCHED_ANALYZE_DAILY_CAP:-200}
      SCHED_REFRESH_BATCH: ${SCHED_REFRESH_BATCH:-100}
      SCHED_ENRICH_BATCH: ${SCHED_ENRICH_BATCH:-50}
      # Full-universe daily price rotation (least-recently-priced first).
      SCHED_PRICE_BATCH: ${SCHED_PRICE_BATCH:-220}
      SCHED_PRICE_INTERVAL_HOURS: ${SCHED_PRICE_INTERVAL_HOURS:-2}
      # Misfire grace (seconds) + boot catch-up slack (hours) for missed jobs.
      SCHED_MISFIRE_DAILY: ${SCHED_MISFIRE_DAILY:-21600}
      SCHED_MISFIRE_HOURLY: ${SCHED_MISFIRE_HOURLY:-300}
      SCHED_CATCHUP_SLACK_HOURS: ${SCHED_CATCHUP_SLACK_HOURS:-6}
      # yfinance throttle handling: backoff ceiling/jitter + in-run circuit breaker.
      YF_BACKOFF_CAP: ${YF_BACKOFF_CAP:-60}
      YF_BACKOFF_JITTER: ${YF_BACKOFF_JITTER:-0.5}
      YF_CIRCUIT_MIN_ATTEMPTS: ${YF_CIRCUIT_MIN_ATTEMPTS:-8}
      YF_CIRCUIT_RATIO: ${YF_CIRCUIT_RATIO:-0.5}
      # NSE/BSE direct scrapers: polite pacing + report-fetch disk guards.
      SCRAPE_MIN_INTERVAL: ${SCRAPE_MIN_INTERVAL:-1.5}
      SCRAPE_BACKOFF_CAP: ${SCRAPE_BACKOFF_CAP:-60}
      SCRAPE_REPORT_MAX_MB: ${SCRAPE_REPORT_MAX_MB:-25}
      SCRAPE_REPORTS_BUDGET_MB: ${SCRAPE_REPORTS_BUDGET_MB:-200}
      SCHED_SHAREHOLDING_BATCH: ${SCHED_SHAREHOLDING_BATCH:-150}
      SCHED_REPORTS_BATCH: ${SCHED_REPORTS_BATCH:-200}
      SCHED_REPORTS_FRESH_DAYS: ${SCHED_REPORTS_FRESH_DAYS:-2}
      SCHED_REPORTS_FRESH_BUDGET_MB: ${SCHED_REPORTS_FRESH_BUDGET_MB:-50}
    volumes:
      # Downloaded filings must outlive the container — they feed the extraction
      # pipeline. (data/reports is gitignored; the budget caps growth per run.)
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy   # api runs migrations first

  # One-shot containerized test run (no host Python needed):
  #   docker compose --profile test run --rm test
  # Uses the same engine image; creates/drops its own ipo_test_<run id> DB on
  # `db`. Unset TEST_RUN_ID means the suite picks a fresh id, so concurrent runs
  # (one per worktree) never share a database; set it to pin a known name.
  test:
    image: wisdominvest-engine
    profiles: ["test"]
    init: true
    working_dir: /app
    command: python -m pytest tests/ -q
    environment:
      TEST_PG_HOST: db
      TEST_PG_PORT: "5432"
      TEST_RUN_ID: ${TEST_RUN_ID:-}
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: wisdominvest-backup
    container_name: ipo_backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPASSWORD: ipo
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      POSTGRES_USER: ipo
      POSTGRES_DB: ipo
    volumes:
      - ./backups:/backups
      - ./scripts/backup/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  ipo_pgdata:
